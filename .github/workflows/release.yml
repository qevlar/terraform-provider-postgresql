# Publishes the qevlar fork on every "v*" tag: GoReleaser builds the release
# archives, then the network mirror metadata is regenerated for all releases
# and deployed to GitHub Pages.
#
# Consumers point Terraform at the mirror with a CLI config:
#   provider_installation {
#     network_mirror {
#       url     = "https://qevlar.github.io/terraform-provider-postgresql/"
#       include = ["registry.terraform.io/cyrilgdn/postgresql"]
#     }
#     direct {
#       exclude = ["registry.terraform.io/cyrilgdn/postgresql"]
#     }
#   }
#
name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Unshallow
        run: git fetch --prune --unshallow
      -
        name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mirror:
    needs: goreleaser
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Generate mirror metadata
        run: scripts/generate-mirror.sh site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
